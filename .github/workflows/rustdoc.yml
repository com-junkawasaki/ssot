name: Deploy rustdoc to GitHub Pages

on:
  push:
    branches:
      - main # Or your default branch

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Build documentation for the entire workspace
      - name: Build workspace documentation
        run: cargo doc --workspace --no-deps

      # Optional custom index page creation (removed as --workspace generates one)
      # - name: Create index page
      #   run: |
      #     echo '<html><head><title>Project Documentation</title></head><body>' > target/doc/index.html
      #     echo '<h1>Project Documentation</h1><ul>' >> target/doc/index.html
      #     echo '<li><a href="fsm_dsl/index.html">fsm-dsl</a></li>' >> target/doc/index.html
      #     # Add links for other crates if built
      #     # echo '<li><a href="fsm_codegen/index.html">fsm-codegen</a></li>' >> target/doc/index.html
      #     echo '</ul></body></html>' >> target/doc/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire target/doc directory generated by --workspace
          path: 'target/doc'

  deploy_docs:
    needs: build_docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 