[package]
name = "fsm-dsl"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "1.0.69"
# Add pest and pest_derive (ensure versions match)
pest = "2.8.0"
pest_derive = "2.8.0"
# Add proc_macro2 and syn for Ident/Span and parsing helpers
proc-macro2 = "1.0.95"
syn = { version = "2.0", features = ["full"] } # "full" feature needed for parsing identifiers

[dev-dependencies]
# Add pretty_assertions for better test diffs
pretty_assertions = "1.4.1"
tempfile = "3"

# Parser dependencies (keep them for future parser implementation)
# pest = "2.7"
# pest_derive = "2.7"

#[features]
#default = []
# Feature to enable serde implementations for AST if needed later
#serde_impls = ["dep:serde"] 